            "name": "TDS kya hota hai?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "TDS (Tax Deducted at Source) ek advance tax collection system hai jisme payment karne wala person ya company (jaise employer ya bank) aapko paise dene se pehle ek fixed percentage tax kaat kar Income Tax Department ko jama kar deta hai. Yeh aapke Form 26AS aur AIS mein reflect hota hai."
            }
          },
          {
            "@type": "Question",
            "name": "Salary par TDS kaise bachega?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "FY 2026-27 mein New Tax Regime ke tahat ₹12,00,000 tak ki taxable income (₹75,000 standard deduction ke saath ₹12,75,000 gross salary) par Section 87A rebate se zero TDS lagta hai. Agar aap Old Tax Regime chunte hain, toh HRA exemption (Section 10(13A)), Section 80C (₹1.5 lakh), Section 80D health insurance, aur NPS (80CCD(1B)) declare karke aap apna monthly TDS bacha sakte hain."
            }
          },
          {
            "@type": "Question",
            "name": "FD par TDS kab kat-ta hai aur Form 15G/15H kya hai?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Section 194A ke tahat agar aapka bank FD interest annual threshold (₹50,000 general / ₹1,00,000 senior citizens FY 2026-27 ke liye; earlier ₹40,000/₹50,000) cross karta hai, toh bank 10% TDS (PAN na hone par 20%) kaat-ta hai. Agar aapki total taxable income exempt limit ke andar hai, toh April mein Form 15G (below 60) ya Form 15H (senior citizens) submit karke TDS rok sakte hain."
            }
          },
          {
            "@type": "Question",
            "name": "TDS return kab bharna hai aur Form 26QC kya hai?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Employers aur businesses har mahine ki 7 tareekh tak TDS jama karte hain aur quarterly Form 24Q/26Q file karte hain. Salaried individuals jo ₹50,000/month se zyada rent dete hain (Section 194IB), woh March mein 2% TDS kaat kar 30 days ke andar Form 26QC file karte hain."
            }
          },
          {
            "@type": "Question",
            "name": "PF se paise kaise nikale aur EPF interest tax-free hai kya?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "EPFO UAN Unified Portal par Aadhaar, PAN aur bank KYC verify karke aap online Form 19 ya Form 31 se PF nikal sakte hain. FY 2026-27 mein EPF par 8.25% p.a. interest milta hai. 5 saal continuous service aur ₹2,50,000 annual employee contribution limit tak PF poori tarah tax-free rehta hai."
